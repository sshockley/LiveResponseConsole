name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force

      - name: PSScriptAnalyzer (fail on Warning or Error)
        shell: pwsh
        run: |
          # Write-Host and Invoke-Expression warnings are intentional in this project
          # (console UI; the wrapper's whole purpose is to run a supplied expression),
          # so those two rules are excluded. Information findings are printed but do not fail.
          $all = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingInvokeExpression
          if ($all) { $all | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host }
          $failing = @($all | Where-Object Severity -in 'Warning', 'Error', 'ParseError')
          if ($failing.Count -gt 0) { throw "PSScriptAnalyzer reported $($failing.Count) warning/error finding(s)." }
          Write-Host "PSScriptAnalyzer: clean ($(@($all).Count) information findings)."

      - name: Parse check
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 -File) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad = $true; Write-Host "::error file=$($f.FullName)::$($errs[0].Message)" }
          }
          if ($bad) { throw 'Parse errors found.' }

      - name: Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-${{ matrix.os }}
          path: testResults.xml
